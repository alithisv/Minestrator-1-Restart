name: Minestrator-Restart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 09:00
    - cron: '0 5 * * *'   # 北京时间 13:00
    - cron: '0 9 * * *'   # 北京时间 17:00
    - cron: '0 13 * * *'  # 北京时间 21:00

jobs:
  run_minestrator_restart:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛡️ 启动代理客户端 (sing-box)
        if: ${{ env.GOST_PROXY != '' }}
        env:
          NODE_URL: ${{ secrets.GOST_PROXY }}
        run: |
          # 1. 生成客户端配置文件
          python gen_proxy.py "$NODE_URL"

          # 2. 下载并安装 sing-box
          SB_VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 sing-box 版本: $SB_VER"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz"
          mv sing-box-${SB_VER}-linux-amd64/sing-box ./sing-box
          chmod +x sing-box

          # 3. 后台启动并在本地 8080 端口提供 HTTP 代理
          nohup ./sing-box run -c sing-box-config.json > singbox.log 2>&1 &
          sleep 3

          # 4. 测试代理出口连通性
          echo "✅ 代理客户端已启动，测试连通性..."
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org || cat singbox.log

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          # 修复：ubuntu-latest 默认源没有 google-chrome-stable，改用 seleniumbase 内置安装
          sudo apt-get install -y xvfb x11-utils xdotool scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver
          seleniumbase install chrome

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          MINESTRATOR_ACCOUNT: ${{ secrets.MINESTRATOR_ACCOUNT }}
          MINESTRATOR_SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
          MINESTRATOR_AUTH: ${{ secrets.MINESTRATOR_AUTH }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python restart_minestrator.py

      - name: 📸 上传截图（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
